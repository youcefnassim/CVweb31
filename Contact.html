<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Youcef Nassim</title>
    <meta name="description" content="Contactez Youcef Nassim pour un projet web ou une collaboration.">
    <meta property="og:title" content="Contact | Youcef Nassim">
    <meta property="og:description" content="Contactez Youcef Nassim pour un projet web ou une collaboration.">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-loaded">
    <!-- Header -->
    <header class="header">
        <a href="#" class="logo">Y<span>oucef Nassim</span>.</a>

        <i class='bx bx-menu' id="menu-icon"></i>

        <nav class="navbar">
            <a href="index.html" data-i18n="nav_home">Accueil</a>
            <a href="À Propos.html" data-i18n="nav_about">À Propos</a>
            <a href="CV.html" data-i18n="nav_resume">CV</a>
            <a href="Services.html" data-i18n="nav_services">Services</a>
            <a href="Portfolio.html" data-i18n="nav_portfolio">Portfolio</a>
            <a href="Offres.html" data-i18n="nav_offers">Offres</a>
            <a href="Contact.html" class="active" data-i18n="nav_contact">Contact</a>
        </nav>
        <div class="header-toggles" style="display: flex; gap: 1rem; align-items: center; margin-left: 2rem;">
            <button id="theme-toggle" class="toggle-btn" style="background: transparent; border: 1px solid var(--text-color); color: var(--text-color); border-radius: 50%; width: 35px; height: 35px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; transition: 0.3s;"><i class='bx bx-moon'></i></button>
            <button id="lang-toggle" class="toggle-btn" style="background: transparent; border: 1px solid var(--text-color); color: var(--text-color); border-radius: 20px; padding: 0.5rem 1rem; cursor: pointer; font-weight: 600; transition: 0.3s;">FR</button>
        </div>

    </header>

    <!-- Section Contact -->
    <section class="contact" id="contact">
        <h2 class="heading">Contactez-<span>Moi</span></h2>

        <form method="POST">
            <div class="input-box">
                <div class="input-field field">
                    <input type="text" name="name" placeholder="Nom Complet" class="input" required>
                    <span class="focus"></span>
                </div>
                <div class="input-field field">
                    <input type="email" name="email" placeholder="Adresse Email" class="input" required>
                    <span class="focus"></span>
                </div>
            </div>

            <div class="input-box">
                <div class="input-field field">
                    <input type="tel" name="phone" placeholder="Numéro Téléphone" class="input">
                    <span class="focus"></span>
                </div>
                <div class="input-field field">
                    <input type="text" name="subject" placeholder="Sujet du message" class="input" required>
                    <span class="focus"></span>
                </div>
            </div>

            <div class="textarea-field field">
                <textarea name="message" cols="30" rows="10" placeholder="Votre Message" class="textarea" required></textarea>
                <span class="focus"></span>
            </div>

            <div class="btn-box btns">
                <button type="submit" class="btn">Envoyer</button>
            </div>
        </form>
    </section>

    
    <!-- Footer -->
    <footer class="footer">
        <div class="footer-text">
            <p>Don't Copyright &copy; 2025 by Youcef Nassim | Muchas gracias afición SUIIIIIIII.</p>
        </div>
    </footer>

    <!-- Chatbot -->
    <div class="chatbot-container" id="chatbotContainer">
        <div class="chatbot-header">
            <div class="chatbot-header-info">
                <div class="chatbot-avatar">
                    <i class='bx bx-bot'></i>
                </div>
                <div>
                    <h3>Assistant Youcef</h3>
                    <p>En ligne</p>
                </div>
            </div>
            <button class="chatbot-close" id="chatbotClose">
                <i class='bx bx-x'></i>
            </button>
        </div>
        <div class="chatbot-messages" id="chatbotMessages">
            <div class="message bot-message">
                <div class="message-avatar">
                    <i class='bx bx-bot'></i>
                </div>
                <div class="message-content">
                    <p>Bonjour ! Je suis l'assistant de Youcef Nassim. Comment puis-je vous aider aujourd'hui ?</p>
                </div>
            </div>
        </div>
        <div class="chatbot-input-container">
            <input type="text" id="chatbotInput" placeholder="Tapez votre message..." class="chatbot-input">
            <button id="chatbotSend" class="chatbot-send-btn">
                <i class='bx bx-send'></i>
            </button>
        </div>
    </div>

    <!-- Chatbot Toggle Button -->
    <button class="chatbot-toggle" id="chatbotToggle">
        <i class='bx bx-message-rounded'></i>
        <span class="chatbot-notification"></span>
    </button>

    <script src="https://unpkg.com/typed.js@2.0.16/dist/typed.umd.js"></script>
    <script src="script.js"></script>
</body>
</html>
